<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - HD Mechanic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #121212; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .portal-card { background: #1e1e2f; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .portal-card .brand { text-align: center; margin-bottom: 2rem; }
        .portal-card .brand h4 { font-weight: 700; color: #fff; }
        .portal-card .brand small { color: #6c757d; }
        .btn-login { padding: 0.6rem 1rem; font-weight: 600; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="brand">
            <h4><i class="bi bi-tools me-2"></i>HD Mechanic</h4>
            <small>Customer Portal</small>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">{{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label text-white">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required autofocus placeholder="you@example.com">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-white">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-login"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="text-secondary small">Staff Login</a>
        </div>
    </div>
</body>
</html>
