{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-wrench me-2"></i>Request Service</h4>
    <a href="/portal/dashboard" class="btn btn-sm btn-outline-secondary">Back</a>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card bg-dark text-white border-secondary">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Select Vehicle</label>
                        <select name="vehicle_info" class="form-select bg-dark text-white border-secondary" required>
                            <option value="">Choose a vehicle...</option>
                            {% for v in vehicles %}
                            <option value="{{ v.year }} {{ v.make }} {{ v.model }} - {{ v.license_plate or 'No plate' }}">{{ v.year }} {{ v.make }} {{ v.model }} ({{ v.license_plate or 'No plate' }})</option>
                            {% endfor %}
                            <option value="New Vehicle">New Vehicle (not listed)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Service Type</label>
                        <select name="service_type" class="form-select bg-dark text-white border-secondary" required>
                            <option value="">Select service...</option>
                            <option value="Oil Change">Oil Change</option>
                            <option value="Brake Service">Brake Service</option>
                            <option value="Engine Repair">Engine Repair</option>
                            <option value="Transmission">Transmission Service</option>
                            <option value="Tire Service">Tire Service</option>
                            <option value="Electrical">Electrical Diagnosis</option>
                            <option value="AC Service">AC Service</option>
                            <option value="Inspection">General Inspection</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preferred Date</label>
                        <input type="date" name="preferred_date" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Details / Description</label>
                        <textarea name="details" class="form-control bg-dark text-white border-secondary" rows="4" placeholder="Describe the issue or service needed..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Submit Request</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-dark text-white border-secondary">
            <div class="card-body">
                <h6><i class="bi bi-info-circle me-2"></i>How it Works</h6>
                <ol class="small text-secondary mb-0">
                    <li>Submit your service request</li>
                    <li>We'll review and contact you</li>
                    <li>Confirm appointment details</li>
                    <li>Drop off your vehicle</li>
                </ol>
            </div>
        </div>
    </div>
</div>
{% endblock %}
