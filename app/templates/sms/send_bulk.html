{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0"><i class="bi bi-chat-left-text me-2"></i>Bulk SMS</h4>
    <a href="/sms/log" class="btn btn-sm btn-outline-secondary">Back to Log</a>
</div>
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Recipients (one phone number per line)</label>
                        <textarea name="numbers" class="form-control font-monospace" rows="6" required placeholder="+1234567890&#10;+0987654321"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Or use a Template</label>
                        <select name="template_id" class="form-select">
                            <option value="">Custom message below...</option>
                            {% for t in templates %}
                            <option value="{{ t.id }}">{{ t.name }} - {{ t.category }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea name="body" class="form-control" rows="4" required placeholder="Type your bulk SMS message..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" onclick="return confirm('Send this SMS to all recipients?')"><i class="bi bi-send me-1"></i>Send to All</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
