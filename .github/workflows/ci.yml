name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  POETRY_VERSION: '1.8.3'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test --no-interaction

      - name: Run Ruff (lint)
        run: poetry run ruff check .

      - name: Run Ruff format check
        run: poetry run ruff format --check .

      - name: Run MyPy (type check)
        run: poetry run mypy app/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crm_test
        ports:
          5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/crm_test
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key-for-testing
      SQUARE_ACCESS_TOKEN: test-token
      SQUARE_ENVIRONMENT: sandbox
      SQUARE_LOCATION_ID: test-location
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test --no-interaction

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U test && break
            sleep 1
          done

      - name: Run database migrations
        run: poetry run flask db upgrade

      - name: Run pytest with coverage
        run: poetry run pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: crm-app:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-app -p 5000:5000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY=test-secret \
            -e DATABASE_URL=sqlite:///test.db \
            -e SQUARE_ACCESS_TOKEN=test \
            -e SQUARE_ENVIRONMENT=sandbox \
            -e SQUARE_LOCATION_ID=test \
            crm-app:latest
          sleep 10
          curl -f http://localhost:5000/health || (docker logs test-app && exit 1)
          docker stop test-app