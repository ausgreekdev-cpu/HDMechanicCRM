name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      CRM_SECRET_KEY: test-secret-key-for-testing-only-1234567890abcdef
      FLASK_DEBUG: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run pytest with coverage
        run: pytest tests/ --cov=app --cov-report=term-missing -v

      - name: Verify Alembic migrations
        run: |
          rm -f /tmp/ci-migrate.db
          CRM_DATABASE_URL="sqlite:////tmp/ci-migrate.db" alembic upgrade head

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: crm-app:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-app -p 8000:8000 \
            -e CRM_SECRET_KEY=test-secret-key-for-testing-only-1234567890abcdef \
            -e CRM_ADMIN_PASSWORD=test-admin-password \
            -e FLASK_DEBUG=0 \
            crm-app:latest
          for i in $(seq 1 30); do
            curl -f http://localhost:8000/health && break
            sleep 2
          done
          curl -f http://localhost:8000/health || (docker logs test-app && exit 1)
          docker stop test-app
