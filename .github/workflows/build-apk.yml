name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate app icon from PNG
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert app/static/icons/icon-512.png -resize 72x72 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert app/static/icons/icon-512.png -resize 96x96 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert app/static/icons/icon-512.png -resize 144x144 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert app/static/icons/icon-512.png -resize 192x192 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert app/static/icons/icon-512.png -resize 512x512 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.5

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hdmechaniccrm.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: HDMechanicCRM v1.0.0
          files: android/app/build/outputs/apk/release/app-release-unsigned.apk
          body: |
            HDMechanicCRM Android APK (WebView wrapper)
            Connects to https://hdmechaniccrm.onrender.com
            Enable "Install from unknown sources" to install.
