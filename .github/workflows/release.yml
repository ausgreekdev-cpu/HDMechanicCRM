name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          previous-tag: ${{ github.ref_name }}
          include-types: |
            feat:Features
            fix:Bug Fixes
            perf:Performance
            refactor:Refactoring
            docs:Documentation
            test:Tests
            chore:Chores

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: false
          files: |
            Dockerfile
            docker-compose.yml
            render.yaml
            Procfile

  build-and-push:
    name: Build & Push Multi-arch Image
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - name: Deploy to Staging
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_STAGING_DEPLOY_HOOK"

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-and-push, deploy-staging]
    if: always()
    steps:
      - name: Notify on success
        if: success()
        run: |
          echo "✅ Release ${{ github.ref_name }} published successfully!"
          echo "📦 Multi-arch Docker image pushed to ghcr.io/${{ github.repository }}"
          echo "🚀 Staging deployment triggered"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Release ${{ github.ref_name }} failed!"